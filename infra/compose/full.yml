name: comicai

# 전체 스택을 컨테이너로 띄우는 compose.
# 사용:
#   docker compose -f infra/compose/full.yml up -d --build
#
# 인프라만 띄우고 앱은 로컬 pnpm dev로 돌리려면 dev.yml 사용.

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-comicai}:${POSTGRES_PASSWORD:-comicai}@postgres:5432/${POSTGRES_DB:-comicai}?schema=public

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  # presigned URL은 브라우저에서 직접 호출하므로 외부에서 접근 가능한 host로 서명.
  # 기본은 호스트 머신에서 노출된 9000 포트. 외부 도메인 노출 시 .env로 오버라이드.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-comicai}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

x-api-env: &api-env
  <<: [*db-env, *s3-env]
  NODE_ENV: production
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 필수 — .env에 설정하세요}@redis:6379
  MASTER_KEY: ${MASTER_KEY:?MASTER_KEY 필수 — .env에 설정하세요}
  # 관리자 허용 목록과 기능 플래그. 비어 있으면 각각 "관리자 없음", "기능 꺼짐".
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  FEATURE_API_KEYS: ${FEATURE_API_KEYS:-0}
  # 메일 발송. 없으면 콘솔 로그로만 남는다.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  # 사용자 키가 없을 때 쓰는 플랫폼 키와 그 지출 상한.
  PLATFORM_GEMINI_KEY: ${PLATFORM_GEMINI_KEY:-}
  PLATFORM_OPENAI_KEY: ${PLATFORM_OPENAI_KEY:-}
  PLATFORM_DAILY_RENDER_LIMIT: ${PLATFORM_DAILY_RENDER_LIMIT:-20}

services:
  postgres:
    image: postgres:16
    container_name: comicai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comicai}
      POSTGRES_DB: ${POSTGRES_DB:-comicai}
    ports:
      # 루프백에만 연다. docker 의 publish 는 0.0.0.0 바인딩이고 iptables 를
      # 직접 건드리므로, 호스트 방화벽으로 막아도 인터넷에서 닿는다.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comicai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: comicai-redis
    restart: unless-stopped
    # 기본 설정의 redis 는 인증이 없다. 세션과 렌더 큐가 들어 있으므로
    # 읽히면 남의 세션을 그대로 쓸 수 있다.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 필수 — .env에 설정하세요}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: comicai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      # 9001 은 MinIO 콘솔이다. 운영에 필요하면 SSH 터널로 연결한다.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: comicai-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
    entrypoint: ["sh", "-c"]
    command: ["cd packages/db && npx prisma migrate deploy"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: comicai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-}
      RENDER_WORKER_DISABLED: "1"
      # 기본을 0 으로 두면 코드의 "프로덕션이면 자동 secure" 판정(session.service.ts)이
      # 항상 덮인다. 빈 값으로 넘겨 코드가 NODE_ENV 로 판단하게 두고,
      # 로컬에서 http 로 띄울 때만 .env 에 0 을 넣는다.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    ports:
      # 외부 접근은 cloudflared 터널을 통해서만. 직접 노출하면 터널의
      # 접근 제어를 우회할 수 있고, trust proxy 와 겹치면 헤더 위조도 가능해진다.
      #
      # ⚠ 터널 라우팅은 Cloudflare 대시보드에 있어 이 저장소에서 확인할 수 없다.
      #   대시보드의 public hostname 이 `http://api:4000`(도커 네트워크 이름)을
      #   가리키면 이 변경은 안전하다. `host.docker.internal:4000` 으로 돼 있다면
      #   루프백 바인딩 때문에 닿지 않으므로, 서비스 이름으로 바꿔야 한다.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: comicai-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      RENDER_WORKER_DISABLED: "0"
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
    command: ["node", "apps/api/dist/worker.js"]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        # 빌드 시점에 번들에 박힌다. 값을 바꾸면 web 을 다시 빌드해야 한다.
        NEXT_PUBLIC_FEATURE_API_KEYS: ${NEXT_PUBLIC_FEATURE_API_KEYS:-0}
    container_name: comicai-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

  # Cloudflare Zero Trust Tunnel — profile=tunnel로 활성화.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: comicai-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # 빈 값이면 cloudflared가 즉시 종료하므로 profile=tunnel 활성 시 .env에 반드시 설정.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
      - api

  # 일일 백업 — profile=backup으로 활성화.
  backup:
    build:
      context: ../backup
    container_name: comicai-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *s3-env
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-comicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comicai}
      POSTGRES_DB: ${POSTGRES_DB:-comicai}
      BACKUP_DIR: /backup
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      RUN_ON_START: ${BACKUP_RUN_ON_START:-0}
    volumes:
      - backup_data:/backup

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backup_data:
