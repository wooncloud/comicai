<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  내보내기 컨테이너의 글꼴 배정.

  `font-noto-cjk-extra` 를 깔아도 fontconfig 의 일반 이름(serif/sans-serif)은 기본 규칙을
  따라 Noto Sans CJK **JP** 로 떨어진다. 그러면 사용자가 '명조' 를 골라도 내보낸 PNG 는
  고딕이고, 화면과 결과물이 달라진다. 여기서 한국어 계열을 먼저 보게 못박는다.

  실제로 컨테이너에서 `fc-match serif` 로 확인하고 적었다.
-->
<fontconfig>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK KR</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
