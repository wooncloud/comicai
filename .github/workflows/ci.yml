name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / test
    # 공개 저장소라 GitHub 호스팅 러너가 무료다. self-hosted 였을 때는 러너가
    # 내려가면 CI 가 통째로 멈췄다(2026-09 에 실제로 발생, 실행이 큐에서 취소됨).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (types/db/events/adapters)
        run: pnpm -r --filter "./packages/*" build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # 앱 빌드까지 여기서 확인한다. 예전에는 packages/* 만 빌드해서, `next build`
      # 에서만 터지는 문제(서버/클라이언트 경계 위반, 정적 생성 실패)가 CI 를 초록으로
      # 통과했다. 그러면 배포 잡이 프로덕션 호스트에서 `--build --force-recreate`
      # 도중에 실패하고, 컨테이너가 어중간하게 재기동된 상태로 남는다.
      - name: Build apps
        run: pnpm build
        env:
          # NEXT_PUBLIC_* 는 빌드 타임에 인라인된다. 값 자체는 여기서 중요하지 않고,
          # 빌드가 통과하는지만 본다(실제 값은 이미지 빌드의 build arg 로 들어간다).
          NEXT_PUBLIC_API_URL: http://localhost:4000
