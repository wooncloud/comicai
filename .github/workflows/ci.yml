name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / test
    # 공개 저장소라 GitHub 호스팅 러너가 무료다. self-hosted 였을 때는 러너가
    # 내려가면 CI 가 통째로 멈췄다(2026-09 에 실제로 발생, 실행이 큐에서 취소됨).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (types/db/events/adapters)
        run: pnpm -r --filter "./packages/*" build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy:
    name: deploy to prod
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 배포만은 프로덕션 호스트에서 돌아야 한다(그 호스트의 compose 를 재기동하므로).
    runs-on: [self-hosted, comicai]
    timeout-minutes: 20
    steps:
      - name: Pull & restart prod compose
        working-directory: ${{ secrets.PROD_REPO_PATH }}
        run: |
          git fetch --prune origin
          git reset --hard origin/main
          docker compose -f infra/compose/full.yml --env-file .env --profile tunnel --profile backup up -d --build --force-recreate web api worker
