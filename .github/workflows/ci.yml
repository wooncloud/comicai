name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / test
    # 공개 저장소라 GitHub 호스팅 러너가 무료다. self-hosted 였을 때는 러너가
    # 내려가면 CI 가 통째로 멈췄다(2026-09 에 실제로 발생, 실행이 큐에서 취소됨).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (types/db/events/adapters)
        run: pnpm -r --filter "./packages/*" build

      # 설정 프로파일 검사. dev/prod 가 같은 키를 정의하는지 본다 — 한쪽에만 있는 키는
      # 배포한 뒤에야 "그 환경에서는 값이 뭐지?" 로 드러난다.
      - name: Env profile
        run: pnpm env:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # 통합 테스트는 testcontainers(Docker)를 쓴다. GitHub 호스팅 러너에는 Docker 가
      # 있으므로 여기서 돌 수 있다. 예전에는 CI 가 이걸 돌리지 않아, 스위트가 만들어진
      # 뒤로 **한 번도 통과한 적이 없다는 사실을 아무도 몰랐다**(vitest 기본 변환기가
      # 데코레이터 메타데이터를 지워 Nest DI 가 깨져 있었다).
      - name: Integration tests
        run: pnpm --filter @comicai/api test:integration

      # 앱 빌드까지 여기서 확인한다. 예전에는 packages/* 만 빌드해서, `next build`
      # 에서만 터지는 문제(서버/클라이언트 경계 위반, 정적 생성 실패)가 CI 를 초록으로
      # 통과했다. 그러면 배포 잡이 프로덕션 호스트에서 `--build --force-recreate`
      # 도중에 실패하고, 컨테이너가 어중간하게 재기동된 상태로 남는다.
      # NEXT_PUBLIC_* 는 env-profile.json 의 dev 그룹에서 온다(next.config.mjs).
      # 예전에는 여기서 손으로 넣어 줬는데, 그러면 프로파일이 비어도 CI 는 초록이었다.
      - name: Build apps
        run: pnpm build
